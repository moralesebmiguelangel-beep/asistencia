<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horario</title>
<meta name="theme-color" content="#5b2a86">
<link rel="manifest" href="horario.webmanifest">
<link rel="icon" href="horario-192.png">
<link rel="apple-touch-icon" href="horario-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Horario">
<style>
:root{--mor:#5b2a86;--fondo:#f5f3f8;--borde:#d6d0de;--tenue:#5f5a66;--tec:#1f4e79;--tec-f:#e3eef9;--art:#9a3412;--art-f:#fdebdc;--tut:#166534;--tut-f:#dcf5e3}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:#1f1b24;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--mor);color:#fff;padding:.7rem 1rem;padding-top:calc(.7rem + env(safe-area-inset-top));position:sticky;top:0;z-index:2}
header h1{margin:0;font-size:1.2rem}
header p{margin:.15rem 0 0;font-size:.9rem;opacity:.9}
main{max-width:720px;margin:0 auto;padding:.8rem}
.ahora{background:#fff;border:3px solid var(--mor);border-radius:14px;padding:.8rem 1rem;margin-bottom:.8rem}
.ahora .et{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mor)}
.ahora .cl{font-size:1.5rem;font-weight:800;margin:.15rem 0}
.ahora .hr{color:var(--tenue)}
.sig{margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--borde);font-size:.95rem}
.dias{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;margin-bottom:.7rem}
.dias button{font:inherit;font-weight:700;min-height:46px;border-radius:10px;border:2px solid var(--borde);background:#fff;color:var(--tenue);cursor:pointer}
.dias button.sel{background:var(--mor);border-color:var(--mor);color:#fff}
.dias button.hoy:not(.sel){border-color:var(--mor);color:var(--mor)}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:4.6rem 1fr;gap:.6rem;align-items:center;background:#fff;border:1px solid var(--borde);border-radius:10px;padding:.55rem .7rem;margin-bottom:.4rem}
li .t{font-size:.85rem;color:var(--tenue);line-height:1.25}
li .t b{display:block;color:#1f1b24;font-size:.95rem}
li .c{font-weight:700;font-size:1.05rem}
li .c small{display:block;font-weight:500;font-size:.85rem;color:var(--tenue)}
li.libre .c{color:var(--tenue);font-weight:500}
li.receso{background:transparent;border-style:dashed;padding:.3rem .7rem}
li.TEC{border-left:7px solid var(--tec)} li.TEC .c{color:var(--tec)}
li.ART{border-left:7px solid var(--art)} li.ART .c{color:var(--art)}
li.TUT{border-left:7px solid var(--tut)} li.TUT .c{color:var(--tut)}
li.actual{outline:3px solid var(--mor);outline-offset:1px}
li.actual .t b::after{content:" · ahora";color:var(--mor)}
li.pasada{opacity:.55}
.ley{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.82rem;color:var(--tenue);margin-top:.6rem}
.ley span::before{content:"";display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:.3rem;vertical-align:-1px}
.ley .TEC::before{background:var(--tec)} .ley .ART::before{background:var(--art)} .ley .TUT::before{background:var(--tut)}
.pie{font-size:.8rem;color:var(--tenue);margin-top:1rem}
</style>
</head>
<body>
<header><h1>Mi horario</h1><p id="fecha"></p></header>
<main>
  <section class="ahora" id="ahora" aria-live="polite"></section>
  <div class="dias" id="dias" role="tablist" aria-label="Día de la semana"></div>
  <ol id="lista"></ol>
  <div class="ley"><span class="TEC">Tecnología</span><span class="ART">Artes</span><span class="TUT">Tutoría</span></div>
  <p class="pie">Ciclo escolar 2026-2027 · Turno matutino. Funciona sin internet.</p>
</main>
<script>
'use strict';
const MODULOS = [
  { n: 1, ini: '07:30', fin: '08:20' }, { n: 2, ini: '08:20', fin: '09:10' }, { n: 3, ini: '09:10', fin: '10:00' },
  { n: 4, ini: '10:00', fin: '10:50' }, { n: 'R', ini: '10:50', fin: '11:10' },
  { n: 5, ini: '11:10', fin: '12:00' }, { n: 6, ini: '12:00', fin: '12:50' }, { n: 7, ini: '12:50', fin: '13:40' }
];
const MAT = { TEC1: ['TEC', 'Tecnología I'], TEC2: ['TEC', 'Tecnología II'], TEC3: ['TEC', 'Tecnología III'], ART3: ['ART', 'Artes III'], TUT: ['TUT', 'Tutoría'] };
// [módulo, materia, grupo] por día (1 = lunes … 5 = viernes)
const HORARIO = {
  1: [[1, 'TEC1', '1° B'], [2, 'TEC1', '1° A'], [3, 'TEC2', '2° A'], [4, 'TEC3', '3° A'], [5, 'ART3', '3° B'], [6, 'TEC2', '2° B'], [7, 'ART3', '3° A']],
  2: [[1, 'TEC3', '3° A'], [2, 'TEC1', '1° A'], [3, 'TEC3', '3° B'], [4, 'TEC1', '1° B']],
  3: [[1, 'TEC2', '2° A'], [2, 'TEC1', '1° A'], [3, 'ART3', '3° B'], [4, 'TEC2', '2° B'], [5, 'TEC1', '1° B'], [6, 'ART3', '3° B'], [7, 'TUT', '3° B']],
  4: [[4, 'TEC3', '3° A'], [5, 'TEC3', '3° B'], [6, 'ART3', '3° A'], [7, 'TEC2', '2° B']],
  5: [[5, 'TEC3', '3° B'], [6, 'TEC2', '2° A'], [7, 'ART3', '3° A']]
};
const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
let diaSel = null;
const min = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const clase = (d, n) => (HORARIO[d] || []).find(x => x[0] === n);
function texto(c) { const [tipo, nombre] = MAT[c[1]]; return { tipo, nombre, grupo: c[2] }; }

function pintar() {
  const ahora = new Date(), d = ahora.getDay(), m = ahora.getHours() * 60 + ahora.getMinutes();
  const laborable = d >= 1 && d <= 5;
  if (diaSel === null) diaSel = laborable ? d : 1;
  document.getElementById('fecha').textContent = `${DIAS[d]} ${ahora.getDate()} de ${MESES[ahora.getMonth()]} · ${ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })}`;

  // Tarjeta «Ahora / Siguiente»
  let html = '';
  if (!laborable) html = `<div class="et">Hoy</div><div class="cl">Sin clases</div><div class="hr">Fin de semana. El lunes empiezas a las 7:30 con ${texto(HORARIO[1][0]).nombre} · ${HORARIO[1][0][2]}.</div>`;
  else {
    const hoy = HORARIO[d];
    const actualMod = MODULOS.find(x => m >= min(x.ini) && m < min(x.fin));
    const cAct = actualMod && actualMod.n !== 'R' ? clase(d, actualMod.n) : null;
    const prox = hoy.map(c => ({ c, mod: MODULOS.find(x => x.n === c[0]) })).find(o => min(o.mod.ini) > m && (!cAct || o.c !== cAct));
    if (cAct) { const t = texto(cAct); html = `<div class="et">Ahora · ${cAct[0]}° módulo</div><div class="cl">${t.nombre} · ${t.grupo}</div><div class="hr">${actualMod.ini} – ${actualMod.fin} · termina en ${min(actualMod.fin) - m} min</div>`; }
    else if (actualMod && actualMod.n === 'R') html = `<div class="et">Ahora</div><div class="cl">Receso</div><div class="hr">10:50 – 11:10</div>`;
    else if (m < min('07:30')) html = `<div class="et">Hoy</div><div class="cl">Aún no empiezan las clases</div>`;
    else if (m >= min('13:40')) html = `<div class="et">Hoy</div><div class="cl">Terminaron tus clases</div><div class="hr">Buen trabajo.</div>`;
    else html = `<div class="et">Ahora</div><div class="cl">Hora libre</div>${actualMod ? `<div class="hr">${actualMod.n}° módulo · ${actualMod.ini} – ${actualMod.fin}</div>` : ''}`;
    if (prox) { const t = texto(prox.c); html += `<div class="sig"><b>Siguiente:</b> ${t.nombre} · ${t.grupo} a las ${prox.mod.ini} (${prox.c[0]}° módulo)</div>`; }
    else if (m < min('13:40')) html += `<div class="sig">No tienes más clases hoy.</div>`;
  }
  document.getElementById('ahora').innerHTML = html;

  // Botones de días
  document.getElementById('dias').innerHTML = [1, 2, 3, 4, 5].map(x =>
    `<button role="tab" data-d="${x}" class="${x === diaSel ? 'sel' : ''} ${x === d ? 'hoy' : ''}" aria-selected="${x === diaSel}">${DIAS[x].slice(0, 3)}</button>`).join('');

  // Lista del día elegido
  const esHoy = diaSel === d;
  document.getElementById('lista').innerHTML = MODULOS.map(mod => {
    if (mod.n === 'R') return `<li class="receso"><span class="t">${mod.ini}</span><span class="c" style="font-weight:500;color:var(--tenue)">Receso</span></li>`;
    const c = clase(diaSel, mod.n);
    const est = esHoy ? (m >= min(mod.ini) && m < min(mod.fin) ? ' actual' : m >= min(mod.fin) ? ' pasada' : '') : '';
    if (!c) return `<li class="libre${est}"><span class="t"><b>${mod.n}° mód.</b>${mod.ini}–${mod.fin}</span><span class="c">Libre</span></li>`;
    const t = texto(c);
    return `<li class="${t.tipo}${est}"><span class="t"><b>${mod.n}° mód.</b>${mod.ini}–${mod.fin}</span><span class="c">${t.grupo}<small>${t.nombre}</small></span></li>`;
  }).join('');
}
document.getElementById('dias').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { diaSel = Number(b.dataset.d); pintar(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { diaSel = null; pintar(); } });
setInterval(pintar, 30000);
pintar();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
