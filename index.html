<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistencia</title>
<meta name="description" content="Control de asistencia sin conexión para seis grupos">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Asistencia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <h1 id="titulo">Asistencia</h1>
  <a id="estado" class="pill local" href="#/config" aria-live="polite">…</a>
</header>
<div id="aviso-actualizacion" class="banner" hidden>
  Hay una versión nueva de la aplicación.
  <button id="btn-actualizar" class="btn small">Actualizar</button>
</div>
<main id="vista" tabindex="-1"></main>
<nav class="bottom" aria-label="Navegación principal">
  <a href="#/" data-nav="grupos"><span aria-hidden="true">▦</span>Grupos</a>
  <a href="#/lista" data-nav="lista"><span aria-hidden="true">✓</span>Pasar lista</a>
  <a href="#/horario" data-nav="horario"><span aria-hidden="true">🕐</span>Horario</a>
  <a href="#/reporte" data-nav="reporte"><span aria-hidden="true">▤</span>Reporte</a>
  <a href="#/config" data-nav="config"><span aria-hidden="true">⚙</span>Configuración</a>
</nav>
<div id="toasts" aria-live="polite"></div>
<div id="impresion" aria-hidden="true"></div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <h2 id="dlg-titulo"></h2>
    <div id="dlg-cuerpo"></div>
    <div class="dlg-botones">
      <button value="ok" class="btn primary" id="dlg-ok">Aceptar</button>
      <button value="cancel" class="btn" id="dlg-cancelar" formnovalidate>Cancelar</button>
    </div>
  </form>
</dialog>
<noscript>Esta aplicación necesita JavaScript activado.</noscript>
<script src="app.js"></script>
</body>
</html>
